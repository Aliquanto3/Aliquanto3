name: Index des projets

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - portfolio.json
      - scripts/**
      - tests/**
      - .github/workflows/portfolio.yml

permissions:
  contents: write

concurrency:
  group: portfolio
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -q
      - name: Générer l'index
        run: python scripts/build_portfolio.py
        env:
          PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
      - name: Commiter si modifié
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: mise à jour de l'index des projets"
            for i in 1 2 3; do
              git pull --rebase && git push && exit 0
              sleep 5
            done
            exit 1
          fi
